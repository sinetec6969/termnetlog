name: Prepare draft beta release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]' build 'setuptools>=68' wheel
      - run: python scripts/check_distribution.py
      - run: python -m build --no-isolation
      - name: Create draft prerelease with tested distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import termnetlog; print(termnetlog.__version__)')
          gh release create "v$VERSION" dist/*.whl dist/*.tar.gz \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "termnetlog $VERSION operator beta" --notes-file CHANGELOG.md
