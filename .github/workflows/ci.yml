name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        dependencies: [current]
        include:
          - python: '3.11'
            dependencies: minimum
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.dependencies == 'current'
        run: python -m pip install '.[dev]'
      - if: matrix.dependencies == 'minimum'
        # textual-dev has its own newer Textual floor; it is not needed by tests.
        run: python -m pip install -c tests/minimum-requirements.txt . 'pytest>=8' 'pytest-asyncio>=0.23' 'adif-io>=0.6.1'
      - run: python -m pip check
      - run: python -m pytest -q

  distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]' build 'setuptools>=68' wheel
      - run: python scripts/check_distribution.py
